<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#010102">
<title>Offline — MD. Sadman Shaharier</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#010102;color:#E8ECF2;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:radial-gradient(ellipse 60% 40% at 50% 45%,rgba(255,170,50,.16),transparent 70%),#010102}
  .core{width:84px;height:84px;margin:0 auto 26px;border-radius:50%;
    background:radial-gradient(circle,#000 0 38%,#ffe9b0 42%,#ffb52e 54%,rgba(255,140,20,.35) 68%,transparent 74%);
    box-shadow:0 0 50px rgba(255,160,40,.6)}
  h1{font-size:26px;letter-spacing:.04em;color:#FFD56B;margin-bottom:10px}
  p{color:rgba(213,219,228,.75);max-width:360px;line-height:1.6;margin:0 auto 24px}
  a{display:inline-block;padding:12px 26px;border-radius:12px;background:#FFB52E;color:#140b02;text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div>
    <div class="core"></div>
    <h1>You're offline</h1>
    <p>The signal is lost beyond the event horizon. Check your connection and try again.</p>
    <a href="./" onclick="location.reload();return false;">Try again</a>
  </div>
</body>
</html>
