<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline — MD. Sadman Shaharier</title>
<meta name="theme-color" content="#0A0A16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/favicon-32.png">
<style>
  /* Inline on purpose: if this page is showing, something already
     failed to load, so it shouldn't depend on an external stylesheet. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #0A0A16; color: #F6F5FB;
    font-family: -apple-system, 'Segoe UI', Inter, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .wrap { max-width: 420px; padding: 32px; }
  .icon {
    width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 16px;
    background: rgba(134,112,240,0.14); display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  p { color: rgba(203,205,236,0.7); font-size: 14.5px; line-height: 1.6; margin-bottom: 28px; }
  button {
    background: linear-gradient(135deg, #8670F0, #F55FA6);
    color: #fff; border: none; padding: 12px 28px; border-radius: 100px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button:hover { opacity: 0.9; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>This page hasn't been saved for offline viewing yet. Reconnect and try again — pages you've already visited will keep working without a connection.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
